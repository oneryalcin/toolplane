[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cli-to-py>=0.1",
    "fastmcp>=3.1",
    "pydantic>=2.0",
    # MontyRepl is pre-1.0 surface: on upgrade re-run tests/test_monty_session.py
    # and revisit the session snapshot/limit guards if pydantic/monty#533 or
    # #534 landed
    "pydantic-monty>=0.0.18,<0.1",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
