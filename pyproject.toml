[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=0.2 for the _global (pre-subcommand flags) kwarg, cli-to-py#7
    "cli-to-py>=0.2",
    # v4 is the line that speaks the 2026-07-28 spec ("MCP 2.0"); upgrade
    # breaks the request_ctx elicitation hack in mcp_facade.py — plan in #132
    "fastmcp>=3.1,<4",
    # we import keyring directly (credentials.py); it also arrives
    # transitively via fastmcp's storage stack
    "keyring>=25",
    "pydantic>=2.0",
    # BETA pin (monty-0.0.19-port branch, #88): the session backend runs on
    # the AsyncMonty subprocess-pool API. Exact pin because the beta API may
    # still churn — reopen to >=0.0.19,<0.0.20 once 0.0.19 stable lands.
    # uv resolves this fine from package metadata (verified: make test /
    # --with-editable), but if a release ever ships on a beta pin, re-check
    # plain `uvx --no-config --refresh-package toolplane` first.
    "pydantic-monty==0.0.19b4",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
