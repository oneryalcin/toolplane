[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=0.2 for the _global (pre-subcommand flags) kwarg, cli-to-py#7
    "cli-to-py>=0.2",
    "fastmcp>=3.1",
    # we import keyring directly (credentials.py); it also arrives
    # transitively via fastmcp's storage stack
    "keyring>=25",
    "pydantic>=2.0",
    # SPIKE BRANCH pin (do not release): the AsyncMonty subprocess-pool port
    # (#88) needs the 0.0.19 beta. Move to >=0.0.19,<0.0.20 when upstream
    # ships stable. The prerelease specifier lets uv resolve the beta.
    "pydantic-monty>=0.0.19b2,<0.0.20",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.uv]
# SPIKE BRANCH (#88): the beta's split-out worker package is a transitive
# dep; naming it here with a prerelease specifier lets uv resolve it
constraint-dependencies = ["pydantic-monty-runtime>=0.0.19b2"]

# the beta (2026-07-09) postdates this machine's global exclude-newer
# cutoff; scope the override to the two monty packages
[tool.uv.exclude-newer-package]
pydantic-monty = "2026-07-10T00:00:00Z"
pydantic-monty-runtime = "2026-07-10T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
