[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=0.2.1: _global pre-subcommand flags (cli-to-py#7) and git's inline
    # --flag=value rendering, without which git log --format dies (cli-to-py#10)
    "cli-to-py>=0.2.1",
    # 4.x permitted again: the escalation contextvar is gated per line
    # (_request_context_var) and the full suite is verified green on
    # 3.2.0 AND 4.0.0b3 (docs/fastmcp4-spike.md). Modern-era elicitation
    # still needs MRTR (#132); betas stay excluded by default resolution.
    "fastmcp>=3.1",
    # we import keyring directly (credentials.py); it also arrives
    # transitively via fastmcp's storage stack
    "keyring>=25",
    "pydantic>=2.0",
    # Keep the default backend inside the tested stable API line. Monty's
    # Python package pins its worker runtime to the exact same version.
    "pydantic-monty>=1.1,<2",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

# An allowlist, not the default "everything not gitignored": a working-tree
# build once swept untracked local dirs (paper/, .codex/) into the sdist.
# bench/results is ~20 MB of committed run data; the code stays so the
# bench validator tests run from an unpacked sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "examples",
    "bench",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "pyproject.toml",
]
exclude = ["bench/results"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
