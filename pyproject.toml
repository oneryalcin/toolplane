[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=0.2 for the _global (pre-subcommand flags) kwarg, cli-to-py#7
    "cli-to-py>=0.2",
    "fastmcp>=3.1",
    # we import keyring directly (credentials.py); it also arrives
    # transitively via fastmcp's storage stack
    "keyring>=25",
    "pydantic>=2.0",
    # HARD pin: monty main (post-0.0.18) deletes MontyRepl for an AsyncMonty
    # subprocess-pool API — 0.0.19 will break our import. Port tracked in the
    # sessions-port issue; on upgrade re-run tests/test_monty_session.py and
    # revisit the snapshot/limit guards (pydantic/monty#533 wedges differently
    # on main, #534 still reproduces there)
    "pydantic-monty>=0.0.18,<0.0.19",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
