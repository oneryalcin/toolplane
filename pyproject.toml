[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolplane"
dynamic = ["version"]
description = "A controlled Python code-mode runtime for programmable tool surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "code-mode", "tools", "mcp", "cli", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=0.2 for the _global (pre-subcommand flags) kwarg, cli-to-py#7
    "cli-to-py>=0.2",
    # <4 / mcp<2: fastmcp 4 + mcp 2 drop mcp.server.lowlevel.server.request_ctx,
    # which CLI escalation re-seats on the pyodide dispatch thread (#144).
    # We import mcp directly, so bound it here rather than via fastmcp-slim.
    "fastmcp>=3.1,<4",
    "mcp<2",
    # we import keyring directly (credentials.py); it also arrives
    # transitively via fastmcp's storage stack
    "keyring>=25",
    "pydantic>=2.0",
    # Keep the default backend inside the tested stable API line. Monty's
    # Python package pins its worker runtime to the exact same version.
    "pydantic-monty>=0.0.19,<0.0.20",
    "tomlkit>=0.15.0",
]

[project.scripts]
toolplane = "toolplane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolplane"]

[tool.hatch.version]
path = "src/toolplane/__init__.py"
